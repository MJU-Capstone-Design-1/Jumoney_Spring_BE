spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never

server:
  forward-headers-strategy: framework

realtime:
  redis:
    host: ${REALTIME_REDIS_HOST:${REDIS_HOST}}
    port: ${REALTIME_REDIS_PORT:6379}
    password: ${REALTIME_REDIS_PASSWORD:${REDIS_PASSWORD}}

kis:
  batch:
    stock-indicator:
      enabled: ${KIS_STOCK_INDICATOR_SCHEDULER_ENABLED:true}
    hts-condition:
      enabled: ${KIS_HTS_CONDITION_SCHEDULER_ENABLED:true}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
