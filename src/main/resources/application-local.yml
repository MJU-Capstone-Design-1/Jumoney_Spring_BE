spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never

realtime:
  redis:
    host: ${REALTIME_REDIS_HOST:localhost}
    port: ${REALTIME_REDIS_PORT:16379}
    password: ${REALTIME_REDIS_PASSWORD:${REDIS_PASSWORD}}

kis:
  batch:
    stock-indicator:
      enabled: ${KIS_STOCK_INDICATOR_SCHEDULER_ENABLED:false}
    hts-condition:
      enabled: ${KIS_HTS_CONDITION_SCHEDULER_ENABLED:false}
    minute-candle:
      enabled: ${KIS_MINUTE_CANDLE_SCHEDULER_ENABLED:false}

verified-operation:
  scheduler:
    enabled: ${VERIFIED_OPERATION_SCHEDULER_ENABLED:false}

# 운영 서버에서 Nginx 리버스 프록시를 사용할 때 HTTPS 도메인을 자동으로 인식
server:
  forward-headers-strategy: framework

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 3600000 #1시간
  refresh-token-validity: 1209600000 #14일
  cookie-secure: false
  cookie-same-site: Lax

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:https://www.jumoney.site/oauth/kakao/callback,https://jumoney.site/oauth/kakao/callback,http://localhost:3000/oauth/kakao/callback}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
