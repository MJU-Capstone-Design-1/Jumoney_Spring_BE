spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

realtime:
  redis:
    host: ${REALTIME_REDIS_HOST:${REDIS_HOST}}
    port: ${REALTIME_REDIS_PORT:6379}
    password: ${REALTIME_REDIS_PASSWORD:${REDIS_PASSWORD}}

kis:
  batch:
    stock-indicator:
      enabled: ${KIS_STOCK_INDICATOR_SCHEDULER_ENABLED:true}
    hts-condition:
      enabled: ${KIS_HTS_CONDITION_SCHEDULER_ENABLED:true}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 3600000 #1시간
  refresh-token-validity: 1209600000 #14일
