name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: jumoney-app
  DEPLOY_DIR: /home/${{ secrets.EC2_USER }}/jumoney

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image metadata
        id: meta
        run: |
          IMAGE_NAME="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          APP_NAME: ${{ env.APP_NAME }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SPRING_PROFILES_ACTIVE: prod
          SPRING_JPA_HIBERNATE_DDL_AUTO: ${{ secrets.SPRING_JPA_HIBERNATE_DDL_AUTO }}
          SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: ${{ secrets.SPRING_BATCH_JDBC_INITIALIZE_SCHEMA }}
          DB_URL: ${{ secrets.DB_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REALTIME_REDIS_HOST: ${{ secrets.REALTIME_REDIS_HOST }}
          REALTIME_REDIS_PORT: ${{ secrets.REALTIME_REDIS_PORT }}
          REALTIME_REDIS_PASSWORD: ${{ secrets.REALTIME_REDIS_PASSWORD }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_SMOKE_ADMIN_KEY: ${{ secrets.KIS_SMOKE_ADMIN_KEY }}
          KIS_HTS_USER_ID: ${{ secrets.KIS_HTS_USER_ID }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_COOKIE_SECURE: ${{ secrets.JWT_COOKIE_SECURE }}
          JWT_COOKIE_SAME_SITE: ${{ secrets.JWT_COOKIE_SAME_SITE }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KIS_STOCK_INDICATOR_SCHEDULER_ENABLED: ${{ secrets.KIS_STOCK_INDICATOR_SCHEDULER_ENABLED }}
          KIS_HTS_CONDITION_SCHEDULER_ENABLED: ${{ secrets.KIS_HTS_CONDITION_SCHEDULER_ENABLED }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: IMAGE_NAME,IMAGE_TAG,APP_NAME,DEPLOY_DIR,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SPRING_PROFILES_ACTIVE,SPRING_JPA_HIBERNATE_DDL_AUTO,SPRING_BATCH_JDBC_INITIALIZE_SCHEMA,DB_URL,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_HOST,REDIS_PORT,REDIS_PASSWORD,REALTIME_REDIS_HOST,REALTIME_REDIS_PORT,REALTIME_REDIS_PASSWORD,KIS_APP_KEY,KIS_APP_SECRET,KIS_SMOKE_ADMIN_KEY,KIS_HTS_USER_ID,JWT_SECRET_KEY,JWT_COOKIE_SECURE,JWT_COOKIE_SAME_SITE,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,KIS_STOCK_INDICATOR_SCHEDULER_ENABLED,KIS_HTS_CONDITION_SCHEDULER_ENABLED
          script: |
            set -eu

            mkdir -p "${DEPLOY_DIR}"

            cat > "${DEPLOY_DIR}/.env" <<EOF
            APP_NAME=${APP_NAME}
            IMAGE_NAME=${IMAGE_NAME}
            IMAGE_TAG=${IMAGE_TAG}
            SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
            SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
            SPRING_BATCH_JDBC_INITIALIZE_SCHEMA=${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA}
            DB_URL=${DB_URL}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            REDIS_HOST=${REDIS_HOST}
            REDIS_PORT=${REDIS_PORT}
            REDIS_PASSWORD=${REDIS_PASSWORD}
            REALTIME_REDIS_HOST=${REALTIME_REDIS_HOST}
            REALTIME_REDIS_PORT=${REALTIME_REDIS_PORT}
            REALTIME_REDIS_PASSWORD=${REALTIME_REDIS_PASSWORD}
            KIS_APP_KEY=${KIS_APP_KEY}
            KIS_APP_SECRET=${KIS_APP_SECRET}
            KIS_SMOKE_ADMIN_KEY=${KIS_SMOKE_ADMIN_KEY}
            KIS_HTS_USER_ID=${KIS_HTS_USER_ID}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE}
            JWT_COOKIE_SAME_SITE=${JWT_COOKIE_SAME_SITE}
            KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
            KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
            KAKAO_ALLOWED_REDIRECT_URIS=${KAKAO_ALLOWED_REDIRECT_URIS}
            KIS_STOCK_INDICATOR_SCHEDULER_ENABLED=${KIS_STOCK_INDICATOR_SCHEDULER_ENABLED}
            KIS_HTS_CONDITION_SCHEDULER_ENABLED=${KIS_HTS_CONDITION_SCHEDULER_ENABLED}
            EOF

            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            cd "${DEPLOY_DIR}"
            docker compose -f docker-compose.yml pull app
            docker compose -f docker-compose.yml up -d --force-recreate app
            docker image prune -f
