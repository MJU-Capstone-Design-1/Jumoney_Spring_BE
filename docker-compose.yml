version: '3.8'

services:
  db:
    image: postgres:15
    container_name: jumoney-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - jumoney-network

  redis:
    image: redis:latest
    container_name: jumoney-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --protected-mode no --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - jumoney-network

  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: ${APP_NAME:-jumoney-app}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    networks:
      - jumoney-network

networks:
  jumoney-network:
    name: jumoney-network
