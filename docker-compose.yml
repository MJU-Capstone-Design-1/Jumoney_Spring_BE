version: '3.8'

services:
  db:
    image: postgres:15
    container_name: jumoney-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      jumoney-network:
        aliases:
          - db

  redis:
    image: redis:latest
    container_name: jumoney-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      jumoney-network:
        aliases:
          - redis

volumes:
  postgres-data:

networks:
  jumoney-network:
    name: jumoney-network
