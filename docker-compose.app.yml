services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: ${APP_NAME:-jumoney-app}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - jumoney-network

networks:
  jumoney-network:
    external: true
    name: jumoney-network
